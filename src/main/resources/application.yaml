spring:
  application:
    name: saas-bling

  datasource:
    username: ${DB_USERNAME:saas-bling}
    password: ${DB_PASSWORD:saas-bling}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saas-bling}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
    secret: ${JWT_SECRET:ChaveSecretaSuperSeguraParaAssinarTokensJwtComPeloMenos256BitsDeTamanho}
    expiration: ${JWT_EXPIRATION:3600000 } # in seconds
